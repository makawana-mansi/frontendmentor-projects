<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Responsive frontend-projects built with HTML and CSS">
    <title>frontend-projects</title>
    <style>
        body {
            text-align: center;
            font-size: 30px;
            background-color: #f2f2f2;

        }

        img {

            width: 50%;
            border-radius: 10px;

        }

        a {
            text-decoration: none;
            color: black;
        }

        a:hover {
            color: white;
        }

        .bu1:hover {
            background: hsl(217, 72%, 64%);
        }

        .bu2:hover {

            background: hsl(158, 36%, 37%);

        }

        .bu3:hover {
            background: hsl(241, 81%, 54%);

        }

        .bu4:hover {
            background: hsl(241, 81%, 54%);

        }

        .bu5:hover {
            background-color: hsl(179, 62%, 43%);
        }

        .bu6:hover {
            background-color: hsl(212, 6%, 44%);

        }

        .bu7:hover {
            background-color: hsl(300, 43%, 22%);


        }

        .bu8:hover {
            background-color: hsl(300, 69%, 71%);
        }

        .bu {
            background-color: #f2f2f2;
        }

        .fir {
            background-color: white;
            margin: 5vmax 20px 0 25vmax;
            width: 50%;
            padding: 50px 0 50px 0;
            border-radius: 10px;
            margin-bottom: 50px;
        }

        button {
            width: 50%;
            border: none;
            padding: 15px;
            border-radius: 8px;
            color: black;
            margin-top: 10px;
            font-size: 15px;
        }

        @media(max-width: 600px) {

            html,
            body {
                margin: 0;
                padding: 0;
                width: 100vmax;

            }

            .fir {
                width: 80vmax;
                margin: 80px 80px;
            }



        }
    </style>
</head>

<body>
    <div>
        <div class="first fir">
            <img src="img1.jpg" alt="QR Code Component"></img>
            <button class="bu1 bu">
                <a href="./Qrcode-component/">QR Code</a>
            </button>
        </div>

        <div class="seco fir">
            <img src="img2.jpg" alt="Profile Card Component"></img>
            <button class="bu2 bu">
                <a href="./Product-preview-card-component/">Profile Card</a>
            </button>
        </div>

        <div class="three fir">
            <img src="img3.jpg" alt="Results-summary-component"></img>
            <button class="bu3 bu">
                <a href="./Results-summary-component/">Results summary</a>
            </button>
        </div>

        <div class="four fir">
            <img src="img4.jpg" alt="order-summary-component"></img>
            <button class="bu4 bu">
                <a href="./order-summary-component/">order summary</a>
            </button>
        </div>

        <div class="five fir">
            <img src="img5.jpg" alt="single-price-grid-component-master"></img>
            <button class="bu5 bu">
                <a href="./single-price-grid-component-master/">order summary</a>
            </button>
        </div>

        <div class="six fir">
            <img src="img6.jpg" alt="four-card-feature-section-master"></img>
            <button class="bu6 bu">
                <a href="./four-card-feature-section-master/">order summary</a>
            </button>
        </div>

        <div class="seven fir">
            <img src="img7.jpg" alt="social proof section master"></img>
            <button class="bu7 bu">
                <a href="./social-proof-section-master/">social proof section master</a>
            </button>
        </div>

        <div class="eight fir">
            <img src="img8.jpg" alt="huddle-landing-page-with-single-introductory-section-master"></img>
            <button class="bu8 bu">
                <a href="./huddle-landing-page-with-single-introductory-section-master/">Huddle Intro Section</a>
            </button>
        </div>

    </div>
</body>

</html>
