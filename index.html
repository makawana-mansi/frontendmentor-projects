<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>frontend-projects</title>
    <style>
        body {
            text-align: center;
            font-size: 30px;
            background-color: #f2f2f2;

        }

        img {

            width: 50%;
            border-radius: 10px;

        }

        a {
            text-decoration: none;
            color: black;


        }

        a:hover {
            color: white
        }

        .first {

            background-color: white;
            margin: 5vmax 20px 0 25vmax;
            width: 50%;
            padding: 50px 0 50px 0;
            border-radius: 10px;
            box-shadow: 0px 0px 10px 0px rgba(0, 0, 0, 0.2);
            margin-bottom: -1px;

        }

        .bu1 {
            background: hsl(212, 45%, 89%);
        }

        .bu1:hover {
            background: hsl(217, 72%, 64%);
        }

        .seco {

            background-color: white;
            margin: 5vmax 20px 0 25vmax;
            width: 50%;
            padding: 50px 0 50px 0;
            border-radius: 10px;
            box-shadow: 0px 0px 10px 0px rgba(0, 0, 0, 0.2);
            margin-bottom: -1px;
        }

        .bu2 {
            background: hsl(30, 38%, 92%);
        }

        .bu2:hover {

            background: hsl(158, 36%, 37%);

        }

        .three {

            background-color: white;
            margin: 5vmax 20px 0 25vmax;
            width: 50%;
            padding: 50px 0 50px 0;
            border-radius: 10px;
            box-shadow: 0px 0px 10px 0px rgba(0, 0, 0, 0.2);
            margin-bottom: 50px;
        }


        .bu3 {
            background-color: hsl(221, 100%, 96%);
        }

        .bu3:hover {
            background: hsl(241, 81%, 54%);

        }

        .four {

            background-color: white;
            margin: 5vmax 20px 0 25vmax;
            width: 50%;
            padding: 50px 0 50px 0;
            border-radius: 10px;
            box-shadow: 0px 0px 10px 0px rgba(0, 0, 0, 0.2);
            margin-bottom: 50px;
        }


        .bu4 {
            background-color: hsl(221, 100%, 96%);
        }

        .bu4:hover {
            background: hsl(241, 81%, 54%);

        }

        button {
            width: 50%;
            border: none;
            padding: 15px;
            border-radius: 8px;
            color: black;
            margin-top: 10px;
            font-size: 15px;
        }

        @media(max-width: 600px) {

            html,
            body {
                margin: 0;
                padding: 0;
                width: 100vmax;

            }

            .first {
                width: 80vmax;
                margin: 80px 80px;
            }

            .seco {
                width: 80vmax;
                margin: 80px 80px;
            }

            .three {
                width: 80vmax;
                margin: 80px 80px;
            }

            .four {
                width: 80vmax;
                margin: 80px 80px;
            }


        }
    </style>
</head>

<body>
    <div>
        <div class="first">
            <img src="img1.jpg" alt="QR Code Component"></img>
            <button class="bu1">
                <a href="./Qrcode-component/">QR Code</a>
            </button>
        </div>

        <div class="seco">
            <img src="img2.jpg" alt="Profile Card Component"></img>
            <button class="bu2">
                <a href="./Product-preview-card-component/">Profile Card</a>
            </button>
        </div>

        <div class="three">
            <img src="img3.jpg" alt="Results-summary-component"></img>
            <button class="bu3">
                <a href="./Results-summary-component/">Results summary</a>
            </button>
        </div>

        <div class="four">
            <img src="img4.jpg" alt="order-summary-component"></img>
            <button class="bu4">
                <a href="./order-summary-component/">order summary</a>
            </button>
        </div>
    </div>
</body>

</html>
