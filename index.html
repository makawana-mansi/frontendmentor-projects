<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>frontend-projects</title>
    <style>
        body {
            text-align: center;
            font-size: 30px;
            background-color: #f2f2f2;

        }

        img {
            height: 30%;
            width: 50%;
            border-radius: 10px;

        }

        a {
            text-decoration: none;
            color: black;


        }

        a:hover {
            color: white
        }

        .first {

            background-color: white;
            margin: 10% 30% 0 20%;
            width: 50%;
            padding: 50px 0 50px 0;
            border-radius: 10px;
            box-shadow: 0px 0px 10px 0px rgba(0, 0, 0, 0.2);
            margin-bottom: -1px;

        }

        .bu1 {
            background: hsl(212, 45%, 89%);
        }

        .bu1:hover {
            background: hsl(217, 72%, 64%);
            color: white;
        }

        .seco {

            background-color: white;
            margin: 10% 30% 0 20%;
            width: 50%;
            padding: 50px 0 50px 0;
            border-radius: 10px;
            box-shadow: 0px 0px 10px 0px rgba(0, 0, 0, 0.2);
            margin-bottom: -1px;
        }

        .bu2 {
            background-color: hsl(221, 100%, 96%);
        }

        .bu2:hover {
            background: hsl(241, 81%, 54%);
            color: white;
        }

        .three {

            background-color: white;
            margin: 10% 30% 0 20%;
            width: 50%;
            padding: 50px 0 50px 0;
            border-radius: 10px;
            box-shadow: 0px 0px 10px 0px rgba(0, 0, 0, 0.2);
            margin-bottom: 50px;
        }

        .bu3 {
            background: hsl(30, 38%, 92%);
        }

        .bu3:hover {
            background: hsl(158, 36%, 37%);
            color: white;
        }

        button {
            width: 50%;
            border: none;
            padding: 15px;
            border-radius: 5px;
            color: black;
            margin-top: 10px;
            font-size: 15px;
        }

        /* 
        button:hover {
            background-color: rgb(132, 174, 245);
            color: white;
        } */
    </style>
</head>

<body>
    <div>
        <div class="first">
            <img src="desktop-design.jpg" alt="QR Code Component"></img>
            <button class="bu1">
                <a href="/QRCode-component/">QR Code</a>
            </button>
        </div>

        <div class="seco">
            <img src="img2.jpg" alt="Profile Card Component"></img><br>
            <button class="bu2">
                <a href="/Profile-card-component/">Profile Card</a>
            </button>
        </div>

        <div class="three">
            <img src="img3.jpg" alt="Profile Card Component"></img><br>
            <button class="bu3">
                <a href="/Results-summary-component/">Results summary</a>
            </button>
        </div>
    </div>
</body>

</html>
